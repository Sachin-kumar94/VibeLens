apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibelens-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vibelens-frontend
  template:
    metadata:
      labels:
        app: vibelens-frontend
    spec:
      containers:
      - name: frontend
        image: gcr.io/vibelens-prod/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: vibelens-secrets
              key: gemini-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: vibelens-frontend-srv
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: vibelens-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vibelens-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: app.vibelens.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vibelens-frontend-srv
            port:
              number: 3000
