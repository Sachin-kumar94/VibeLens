version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./data/vibelens.db
      - FRONTEND_URL=http://localhost:3000
      - BACKEND_URL=http://localhost:5000
    volumes:
      - vibelens-data:/app/data

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  vibelens-data:
